<!doctype html>
<html><head><meta charset="utf-8"><title>09 Car mode (phone)</title>
<link rel="stylesheet" href="mf.css"><script src="icons.js"></script>
<style>
  html, body, .screen { width: 915px; height: 412px; }
  .screen { background: radial-gradient(60% 90% at 0% 100%, rgba(91, 59, 230, .22), rgba(91,59,230,0) 70%), #07050D; color: #fff; }
  .sb { height: 30px; padding: 0 26px 0 64px; font-size: 13.5px; }
  .sb .sb-cam { display: none; }
  .cam { position: absolute; left: 14px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border-radius: 50%; background: #000; box-shadow: inset 0 0 0 2px #15121c; z-index: 60; }
  .head { position: absolute; top: 34px; left: 56px; right: 26px; height: 60px; display: flex; align-items: center; gap: 14px; }
  .head .title { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  .state { display: flex; align-items: center; gap: 8px; margin-left: 12px; padding: 8px 14px; border-radius: 14px; background: rgba(43,217,160,.12); color: #5EF0BF; font-size: 15px; font-weight: 600; }
  .state .dot { width: 9px; height: 9px; border-radius: 50%; background: #2BD9A0; box-shadow: 0 0 0 4px rgba(43,217,160,.2); }
  .exit { margin-left: auto; height: 56px; padding: 0 22px; border-radius: 18px; background: #1C1729; color: #fff; display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; border: 1.5px solid #2E2744; }

  .voice { position: absolute; left: 56px; top: 104px; width: 248px; height: 272px; border-radius: 30px; background: linear-gradient(160deg, #2A1279 0%, #4F3BE0 70%, #8A45E0 100%);
           display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-top: 6px; box-shadow: 0 20px 40px -14px rgba(91,59,230,.6); overflow: hidden; }
      .micbtn { width: 116px; height: 116px; border-radius: 58px; background: #fff; color: #4F3BE0; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1;
            box-shadow: 0 0 0 14px rgba(255,255,255,.14), 0 0 0 32px rgba(255,255,255,.06), 0 18px 30px -8px rgba(10,0,40,.6); }
  .voice .vl { font-size: 22px; font-weight: 700; position: relative; z-index: 1; margin-top: 10px; }
  .voice .vs { font-size: 15px; color: rgba(255,255,255,.75); margin-top: -12px; position: relative; z-index: 1; }

  .grid { position: absolute; left: 320px; right: 26px; top: 104px; height: 272px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: minmax(0,1fr) minmax(0,1fr); gap: 14px; }
  .tile { background: #15111F; border: 1.5px solid #241E35; border-radius: 24px; padding: 14px 16px 14px; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
  .tile .ti { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  .tile .tt { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .tile .ts { font-size: 14px; color: #B9B3CF; margin-top: 1px; font-weight: 500; }
  .tile .play { position: absolute; right: 14px; top: 14px; width: 46px; height: 46px; border-radius: 23px; background: #FF5C8A; color: #fff; display: flex; align-items: center; justify-content: center; }
  .tile.add { border-style: dashed; border-color: #3A3352; background: transparent; align-items: center; justify-content: center; gap: 8px; color: #B9B3CF; }
  .tile .prog { height: 5px; border-radius: 3px; background: #2E2744; margin-top: 7px; overflow: hidden; }
  .tile .prog span { display: block; height: 100%; width: 38%; background: #FF5C8A; border-radius: 3px; }
  .nav { height: 20px; }
</style></head>
<body><div class="screen">
  <div class="sb"></div>
  <span class="cam"></span>
  <div class="head">
    <span data-logo="34,#FFFFFF,#FF8AB0"></span>
    <span class="title">Car mode</span>
    <span class="state"><span class="dot"></span>Parked — browsing available</span>
    <span class="exit"><i data-i="exit" data-s="24" data-w="2.2"></i>Exit</span>
  </div>

  <div class="voice">
    <div class="micbtn"><i data-i="mic" data-s="56" data-w="2"></i></div>
    <div class="vl">Tap to speak</div>
    <div class="vs">“Read the news”, “Open maps”</div>
  </div>

  <div class="grid">
    <div class="tile"><span class="ti" style="background:#12324A;color:#5CC8FF"><i data-i="nav" data-s="25" data-w="2.2"></i></span><div><div class="tt">Maps</div><div class="ts">Pinned web app</div></div></div>
    <div class="tile"><span class="ti" style="background:#3A1630;color:#FF7FB0"><i data-i="music" data-s="25" data-w="2.2"></i></span><div><div class="tt">Music</div><div class="ts">Web player</div></div></div>
    <div class="tile"><span class="ti" style="background:#3A2A10;color:#FFC34D"><i data-i="cloud" data-s="25" data-w="2.2"></i></span><div><div class="tt">24° Pune</div><div class="ts">Light rain at 6 pm</div></div></div>
    <div class="tile"><span class="ti" style="background:#2A1D55;color:#B7A5FF"><i data-i="speaker" data-s="25" data-w="2.2"></i></span><span class="play"><i data-i="play" data-s="24" data-w="0"></i></span><div><div class="tt">Read aloud</div><div class="ts">3 saved articles</div><div class="prog"><span></span></div></div></div>
    <div class="tile"><span class="ti" style="background:#113A30;color:#5EF0BF"><i data-i="podcast" data-s="25" data-w="2.2"></i></span><div><div class="tt">Podcasts</div><div class="ts">Web player</div></div></div>
    <div class="tile add"><i data-i="plus" data-s="34" data-w="2.2"></i><div style="font-size:17px;font-weight:600">Add shortcut</div></div>
  </div>
  <div class="nav"></div>
</div></body></html>
